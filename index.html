<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vyronix-web</title>
  </head>
  <body>
    <div id="error-overlay" style="display: none; padding: 20px; color: red; background: black; z-index: 9999; position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: auto;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML += '<p>Error: ' + message + '<br>Source: ' + source + ':' + lineno + ':' + colno + '<br>' + (error && error.stack ? error.stack : '') + '</p>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        var overlay = document.getElementById('error-overlay');
        overlay.style.display = 'block';
        overlay.innerHTML += '<p>Unhandled Promise Rejection: ' + event.reason + '</p>';
      });
      window.addEventListener('error', function(event) {
        if (event.target && event.target.tagName === 'SCRIPT') {
          var overlay = document.getElementById('error-overlay');
          overlay.style.display = 'block';
          overlay.innerHTML += '<p>Failed to load script: ' + event.target.src + '</p>';
        }
      }, true);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script nomodule>
      var overlay = document.getElementById('error-overlay');
      overlay.style.display = 'block';
      overlay.innerHTML = '<div style="padding: 20px;"><h2>Unsupported Browser</h2><p>Your mobile browser does not support modern JavaScript modules, which Vite uses during development mode. Please use a modern browser, or run a production build.</p></div>';
    </script>
  </body>
</html>
